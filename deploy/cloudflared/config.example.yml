# Named Cloudflare Tunnel for frontiershealth.xyz, run from a laptop.
#
# Why a named tunnel and not the quick one: a `cloudflared tunnel --url ...`
# quick tunnel only ever answers on the random *.trycloudflare.com name it is
# given, and that name changes every time the process restarts. A custom domain
# cannot be pointed at it -- a CNAME to trycloudflare.com reaches Cloudflare's
# edge, but no tunnel ingress claims that hostname, so it returns error 1033.
# A named tunnel claims the hostnames below, so the domain itself works and
# survives a restart.
#
# Setup, and what each step needs (see docs/demo-host.md "Cloudflare Tunnel"):
#   1. cloudflared tunnel login                     (browser; writes cert.pem)
#   2. cloudflared tunnel create frontiers-health   (prints the UUID)
#   3. copy this file to ~/.cloudflared/config.yml and fill in the UUID
#   4. cloudflared tunnel route dns frontiers-health frontiershealth.xyz
#      cloudflared tunnel route dns frontiers-health api.frontiershealth.xyz
#   5. cloudflared tunnel run frontiers-health
#
# The zone must be on Cloudflare DNS for step 4 to create the records.

tunnel: <TUNNEL-UUID>
credentials-file: /Users/<you>/.cloudflared/<TUNNEL-UUID>.json

# Cloudflare terminates TLS at its edge, so nothing here needs a certificate
# and the stack keeps publishing on 127.0.0.1 only. Caddy and the compose
# `demo` profile are not used on this path.
ingress:
  # The app. Every API call it makes is server-side over the compose network,
  # so this one hostname is enough for the product to work.
  - hostname: frontiershealth.xyz
    service: http://127.0.0.1:3000

  - hostname: www.frontiershealth.xyz
    service: http://127.0.0.1:3000

  # Optional: the public API and its Swagger docs at /docs. Worth having for
  # judges who want to see the real endpoints. Drop this rule (and its DNS
  # record) to keep the API private.
  - hostname: api.frontiershealth.xyz
    service: http://127.0.0.1:8000

  # Required last rule: anything else gets a 404 rather than being proxied.
  - service: http_status:404
